name: Auto build aria2-next

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Upstream tag to build (empty = latest release), e.g. v3.1.1"
        required: false
        type: string
      force:
        description: "Rebuild even if this repository already has that release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: auto-build-aria2-next
  cancel-in-progress: false

env:
  UPSTREAM_REPO: AnInsomniacy/aria2-next
  UPSTREAM_URL: https://github.com/AnInsomniacy/aria2-next
  ALPINE_IMAGE: alpine:3.24

jobs:
  check:
    name: Check upstream release
    runs-on: ubuntu-24.04
    outputs:
      should_build: ${{ steps.resolve.outputs.should_build }}
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      source_epoch: ${{ steps.resolve.outputs.source_epoch }}
    steps:
      - name: Resolve upstream release
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
          FORCE_REBUILD: ${{ inputs.force }}
        run: |
          set -euo pipefail

          if [ -n "${REQUESTED_VERSION:-}" ]; then
            TAG="v${REQUESTED_VERSION#v}"
            RELEASE_JSON=$(gh api "repos/${UPSTREAM_REPO}/releases/tags/${TAG}")
          else
            RELEASE_JSON=$(gh api "repos/${UPSTREAM_REPO}/releases/latest")
            TAG=$(printf '%s' "$RELEASE_JSON" | jq -r .tag_name)
          fi

          VERSION="${TAG#v}"
          PUBLISHED=$(printf '%s' "$RELEASE_JSON" | jq -r .published_at)

          RELEASE_EXISTS=false
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            RELEASE_EXISTS=true
          fi

          if [ "${FORCE_REBUILD:-false}" = "true" ] || [ "$RELEASE_EXISTS" = "false" ]; then
            SHOULD_BUILD=true
          else
            SHOULD_BUILD=false
          fi

          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "source_epoch=$(date -u -d "$PUBLISHED" +%s)"
            echo "should_build=$SHOULD_BUILD"
          } >> "$GITHUB_OUTPUT"

          if [ "$SHOULD_BUILD" = "false" ]; then
            echo "::notice::aria2-next $VERSION already has a release here; skipping. Re-run manually with force=true to rebuild."
          else
            echo "::notice::Building aria2-next $VERSION from tag $TAG"
          fi

  build-native:
    name: ${{ matrix.name }}
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner: ubuntu-22.04
            platform: linux
            verify_profile: linux
            processor: x86_64
            artifact: linux-x86_64
          - name: Linux ARM64
            runner: ubuntu-22.04-arm
            platform: linux
            verify_profile: linux
            processor: aarch64
            artifact: linux-aarch64
          - name: macOS ARM64
            runner: macos-15
            platform: macos
            verify_profile: macos
            processor: arm64
            artifact: macos-arm64
          - name: macOS Intel
            runner: macos-15-intel
            platform: macos
            verify_profile: macos
            processor: x86_64
            artifact: macos-x86_64
    env:
      ARIA2_BUILD_PROFILE: release
      CMAKE_BUILD_TYPE: Release
      STRIP_BINARY: "true"
      TARGET_PROCESSOR: ${{ matrix.processor }}
      MACOSX_VERSION_MIN: "11.0"
      SOURCE_DATE_EPOCH: ${{ needs.check.outputs.source_epoch }}
    steps:
      - name: Checkout aria2-next ${{ needs.check.outputs.tag }}
        uses: actions/checkout@v7.0.1
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ needs.check.outputs.tag }}
          fetch-depth: 1

      - name: Verify runner tools
        run: packaging/scripts/verify-runner-tools ${{ matrix.verify_profile }}

      - name: Build release binary
        run: packaging/scripts/build-release ${{ matrix.platform }}

      - name: Package binary
        run: |
          cp build/release/aria2-next "aria2-next-${{ needs.check.outputs.version }}-${{ matrix.artifact }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: aria2-next-${{ needs.check.outputs.version }}-${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 7

  build-windows:
    name: ${{ matrix.name }}
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x86_64
            architecture: x86_64
            verify_profile: windows-x86_64
            runtime_platform: windows-x86_64
            artifact: windows-x86_64.exe
          - name: Windows ARM64
            architecture: aarch64
            verify_profile: windows-arm64
            runtime_platform: windows-arm64
            artifact: windows-arm64.exe
    env:
      ARIA2_BUILD_PROFILE: release
      CMAKE_BUILD_TYPE: Release
      STRIP_BINARY: "true"
      TARGET_PROCESSOR: ${{ matrix.architecture }}
      RUNTIME_PLATFORM: ${{ matrix.runtime_platform }}
      ARIA2_RELEASE_LTO: OFF
      SOURCE_DATE_EPOCH: ${{ needs.check.outputs.source_epoch }}
    steps:
      - name: Checkout aria2-next ${{ needs.check.outputs.tag }}
        uses: actions/checkout@v7.0.1
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ needs.check.outputs.tag }}
          fetch-depth: 1

      - name: Install LLVM-MinGW
        run: |
          . packaging/dependencies.env
          . packaging/scripts/common.sh
          curl_fetch "$LLVM_MINGW_URL" "$LLVM_MINGW_ARCHIVE" "$LLVM_MINGW_SHA256"
          tar xf "$LLVM_MINGW_ARCHIVE"
          echo "$PWD/llvm-mingw-$LLVM_MINGW_VERSION-ucrt-ubuntu-22.04-x86_64/bin" >> "$GITHUB_PATH"

      - name: Configure toolchain
        run: |
          prefix=${{ matrix.architecture }}-w64-mingw32
          {
            echo "CC=${prefix}-clang"
            echo "CXX=${prefix}-clang++"
            echo "RC=${prefix}-windres"
            echo "AR=${prefix}-ar"
            echo "RANLIB=${prefix}-ranlib"
            echo "STRIP=${prefix}-strip"
            echo "OBJDUMP=${prefix}-objdump"
          } >> "$GITHUB_ENV"

      - name: Verify runner tools
        run: packaging/scripts/verify-runner-tools ${{ matrix.verify_profile }}

      - name: Build release binary
        run: packaging/scripts/build-release windows

      - name: Package binary
        run: |
          cp build/release/aria2-next.exe "aria2-next-${{ needs.check.outputs.version }}-${{ matrix.artifact }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ matrix.runtime_platform }}
          path: aria2-next-${{ needs.check.outputs.version }}-${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 7

  build-android:
    name: Android ARM64
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      API: "24"
      ARIA2_BUILD_PROFILE: release
      CMAKE_BUILD_TYPE: Release
      STRIP_BINARY: "true"
      STRIP: llvm-strip
      READELF: llvm-readelf
      SOURCE_DATE_EPOCH: ${{ needs.check.outputs.source_epoch }}
    steps:
      - name: Checkout aria2-next ${{ needs.check.outputs.tag }}
        uses: actions/checkout@v7.0.1
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ needs.check.outputs.tag }}
          fetch-depth: 1

      - name: Resolve Android NDK
        run: |
          . packaging/dependencies.env
          NDK_HOME=$(ls -d "${ANDROID_HOME:?}/ndk/$ANDROID_NDK_VERSION".* 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -z "$NDK_HOME" ]; then
            sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
            package=$("$sdkmanager" --list 2>/dev/null | grep -o "ndk;$ANDROID_NDK_VERSION\.[0-9.]*" | sort -V | tail -n 1)
            test -n "$package"
            "$sdkmanager" --install "$package" > /dev/null
            NDK_HOME="$ANDROID_HOME/ndk/${package#ndk;}"
          fi
          test -f "$NDK_HOME/source.properties"
          echo "NDK=$NDK_HOME" >> "$GITHUB_ENV"
          echo "$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Verify runner tools
        run: packaging/scripts/verify-runner-tools android

      - name: Build release binary
        run: packaging/scripts/build-release android

      - name: Package binary
        run: |
          cp build/release/aria2-next "aria2-next-${{ needs.check.outputs.version }}-android-arm64"
          chmod 755 "aria2-next-${{ needs.check.outputs.version }}-android-arm64"

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: android-arm64
          path: aria2-next-${{ needs.check.outputs.version }}-android-arm64
          if-no-files-found: error
          retention-days: 7

  build-alpine:
    name: ${{ matrix.name }}
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Alpine Linux x86_64 (musl)
            runner: ubuntu-24.04
            artifact: alpine-x86_64
          - name: Alpine Linux ARM64 (musl)
            runner: ubuntu-24.04-arm
            artifact: alpine-aarch64
    env:
      SOURCE_DATE_EPOCH: ${{ needs.check.outputs.source_epoch }}
      VERSION: ${{ needs.check.outputs.version }}
      ARTIFACT: ${{ matrix.artifact }}
    steps:
      - name: Checkout build tooling
        uses: actions/checkout@v7.0.1

      - name: Checkout aria2-next ${{ needs.check.outputs.tag }}
        uses: actions/checkout@v7.0.1
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ needs.check.outputs.tag }}
          path: upstream
          fetch-depth: 1

      - name: Build static musl binary
        run: |
          docker run --rm \
            --volume "$PWD:/src" \
            --workdir /src/upstream \
            --env SOURCE_DATE_EPOCH \
            --env ALPINE_LDFLAGS=-static \
            --env CMAKE_POLICY_VERSION_MINIMUM=3.5 \
            "$ALPINE_IMAGE" sh -euxc '
              apk add --no-cache build-base cmake ninja pkgconf perl bash tar git linux-headers python3
              sh /src/scripts/build-alpine.sh
            '

      - name: Package binary
        run: |
          cp upstream/build/release/aria2-next "aria2-next-${VERSION}-${ARTIFACT}"
          test -s "aria2-next-${VERSION}-${ARTIFACT}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: aria2-next-${{ needs.check.outputs.version }}-${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release
    needs:
      - check
      - build-native
      - build-windows
      - build-android
      - build-alpine
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum aria2-next-* > "../aria2-next-${{ needs.check.outputs.version }}-checksums.sha256"
          cd ..
          mv "aria2-next-${{ needs.check.outputs.version }}-checksums.sha256" artifacts/

      - name: Create and upload release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/notes.md"
          {
            echo "Unmodified build of upstream [aria2-next $VERSION]($UPSTREAM_URL/releases/tag/$TAG)."
            echo
            echo "Assets:"
            echo
            for file in artifacts/aria2-next-*; do
              case "$file" in
                *.sha256) continue ;;
              esac
              printf -- '- `%s`\n' "$(basename "$file")"
            done
            echo
            echo "On top of the seven platforms upstream ships, this repository adds **Alpine Linux**"
            echo "builds (musl, statically linked, built in a \`$ALPINE_IMAGE\` container): \`alpine-x86_64\` and \`alpine-aarch64\`."
            echo
            echo "Sources and license follow the upstream release (GPLv2); the source is not modified."
          } > "$notes"

          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "aria2-next $VERSION (auto-build)" \
              --notes-file "$notes"
          fi

          gh release upload "$TAG" artifacts/* --clobber --repo "$GITHUB_REPOSITORY"

      - name: Summary
        run: |
          {
            echo "## aria2-next ${{ needs.check.outputs.version }}"
            echo
            echo "Published ${{ needs.check.outputs.tag }} with the upstream build matrix plus Alpine (musl) x86_64 and aarch64."
          } >> "$GITHUB_STEP_SUMMARY"
